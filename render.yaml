services:

  - type: web
    name: field-ai-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health

    envVars:
      - key: APP_NAME
        value: Field AI Decision Copilot

      - key: APP_ENV
        value: production

      - key: DEBUG
        value: "false"

      - key: LLM_PROVIDER
        value: groq

      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      - key: GROQ_API_KEY
        sync: false

      - key: CORS_ORIGINS
        sync: false


  - type: web
    name: field-ai-frontend
    runtime: static
    rootDir: frontend

    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        sync: false
