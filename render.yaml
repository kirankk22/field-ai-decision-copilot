services:

  # ============================================================
  # Backend — FastAPI + RAG + LLM
  # ============================================================

  - type: web
    name: field-ai-backend
    runtime: docker
    plan: free

    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .

    healthCheckPath: /health

    envVars:

      - key: APP_NAME
        value: Field AI Decision Copilot

      - key: APP_ENV
        value: production

      - key: DEBUG
        value: "false"

      - key: LLM_PROVIDER
        value: groq

      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      - key: GROQ_API_KEY
        sync: false

      # Automatically use the public Render URL
      # of the frontend.
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: field-ai-frontend
          envVarKey: RENDER_EXTERNAL_URL


  # ============================================================
  # Frontend — React/Vite Static Site
  # ============================================================

  - type: web
    name: field-ai-frontend
    runtime: static

    rootDir: frontend

    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:

      # Automatically use the public Render URL
      # of the backend.
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: field-ai-backend
          envVarKey: RENDER_EXTERNAL_URL
