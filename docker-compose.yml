services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: field-ai-backend

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    volumes:
      - field-ai-vectorstore:/app/data/vectorstore

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


volumes:

  field-ai-vectorstore:
    external: true
    name: field-ai-vectorstore