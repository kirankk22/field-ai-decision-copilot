services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: field-ai-backend

    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LLM_PROVIDER: ${LLM_PROVIDER}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}

    ports:
      - "8000:8000"

    volumes:
      - field-ai-vectorstore:/app/data/vectorstore

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


volumes:

  field-ai-vectorstore:
    external: true
    name: field-ai-vectorstore
